apis:
- name: ElectronX FIX API
  description: >-
    The ElectronX FIX API provides programmatic access to the exchange through
    three session types: Order Entry (submit, modify, cancel orders and receive
    execution reports), Market Data (real-time prices and order book depth), and
    Drop Copy (receive-only consolidated firm execution activity). Sessions use
    FIXT.1.1 for the transport layer and FIX 5.0 SP2 for the application layer,
    authenticated via SenderCompID over SSL/TLS.
