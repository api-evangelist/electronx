aid: electronx
name: Electronx
description: >-
  ElectronX is a CFTC-regulated financial exchange (Designated Contract Market)
  and clearinghouse (Derivatives Clearing Organization) operating the first
  U.S.-regulated, direct-access power derivatives market. It offers 1MW hourly
  bounded futures and binary options that let energy market participants hedge
  intraday electricity price volatility across ISOs including ERCOT, PJM, MISO,
  and CAISO. Traders connect through a browser-based platform or programmatically
  via a FIX API providing order entry, market data, and drop copy sessions.
  ElectronX is backed by DCVC and has raised more than $55M across seed and
  Series A rounds to democratize access to electricity risk-management tools for
  battery storage operators, distributed energy resource aggregators, trading
  firms, and commercial power consumers.
